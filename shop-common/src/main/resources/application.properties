spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.main.banner-mode=off
spring.kafka.consumer.group-id=shop
spring.kafka.consumer.auto-offset-reset=earliest

# Only what tells the story goes to the console.
logging.level.root=WARN
logging.level.shop=INFO
logging.level.org.springframework.context.support.DefaultLifecycleProcessor=INFO
logging.level.org.springframework.orm.jpa.LocalContainerEntityManagerFactoryBean=INFO
logging.level.com.zaxxer.hikari.HikariDataSource=INFO
